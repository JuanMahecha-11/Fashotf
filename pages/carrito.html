<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carrito - Fashotf Delivery</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 32px; padding: 32px 0 80px; }
    .cart-items { display: flex; flex-direction: column; gap: 16px; }
    .cart-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; gap: 16px; align-items: center; transition: all 0.2s; }
    .cart-item:hover { border-color: rgba(255,90,31,0.3); }
    .cart-item-img { width: 80px; height: 80px; background: var(--surface2); border-radius: 14px; overflow: hidden; flex-shrink: 0; }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
    .cart-item-rest { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .qty-ctrl { display: flex; align-items: center; gap: 12px; }
    .qty-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .qty-btn:hover { background: var(--orange); border-color: var(--orange); color: #fff; }
    .qty-num { font-weight: 800; font-size: 16px; min-width: 20px; text-align: center; }
    .cart-item-price { font-size: 20px; font-weight: 800; color: var(--orange); text-align: right; }
    .del-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(239,68,68,0.3); background: rgba(239,68,68,0.1); color: var(--red); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .del-btn:hover { background: var(--red); color: #fff; }

    .order-summary { position: sticky; top: 90px; height: fit-content; }
    .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
    .summary-title { font-size: 20px; font-weight: 800; margin-bottom: 24px; }
    .summary-row { display: flex; justify-content: space-between; font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .summary-row:last-of-type { border-bottom: none; }
    .summary-total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; margin: 16px 0 24px; padding-top: 16px; border-top: 2px solid var(--border); }
    .summary-total span:last-child { color: var(--orange); }

    .coupon-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .coupon-row input { flex: 1; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Outfit',sans-serif; font-size: 14px; outline: none; }
    .coupon-row button { padding: 12px 18px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: 'Outfit',sans-serif; }
    .coupon-row button:hover { background: var(--orange); border-color: var(--orange); color: #fff; }

    .pay-methods { display: flex; gap: 10px; margin-bottom: 20px; }
    .pay-method { flex: 1; padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; text-align: center; cursor: pointer; font-size: 18px; transition: all 0.2s; color: var(--text); }
    .pay-method:hover, .pay-method.active { border-color: var(--orange); background: rgba(255,90,31,0.1); color: var(--orange); }
    .pay-method span { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }

    .empty-cart { text-align: center; padding: 80px 20px; }
    .empty-cart i { font-size: 72px; color: var(--orange); display: block; margin-bottom: 20px; opacity: 0.8; }
    .empty-cart h2 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
    .empty-cart p { color: var(--text-muted); margin-bottom: 28px; }

    @media(max-width:1024px){ .cart-layout{ grid-template-columns:1fr; } .order-summary{ position:static; } }
  </style>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-logo"><div class="logo-icon"><i class="fa-solid fa-bolt"></i></div><span class="logo-text">FASHOTF</span><span class="logo-sub">DELIVERY</span></div>
  <ul class="nav-links">
    <li><a href="../index.html"><i class="fa-solid fa-compass"></i> Explorar</a></li>
    <li><a href="menu.html"><i class="fa-solid fa-utensils"></i> Menú</a></li>
    <li><a href="ofertas.html"><i class="fa-solid fa-fire"></i> Ofertas</a></li>
    <li><a href="rastreo.html"><i class="fa-solid fa-map-pin"></i> Rastreo</a></li>
    <li><a href="historial.html"><i class="fa-solid fa-clock-rotate-left"></i> Historial</a></li>
    <li><a href="cliente.html"><i class="fa-solid fa-user"></i> Mi Cuenta</a></li>
  </ul>
  <div class="nav-actions"><a href="carrito.html" class="btn-cart"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count" id="cartCount">0</span></a><a href="login.html" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Sesión</a></div>
</nav>

<section class="page-header">
  <div class="container"><h1><i class="fa-solid fa-cart-shopping" style="color:var(--orange)"></i> Tu Carrito</h1><p>Revisa tu pedido antes de confirmar</p></div>
</section>

<div class="container">
  <div id="cartContent" style="padding:32px 0 80px;"></div>
</div>

<footer class="footer"><div class="container"><div class="footer-bottom">© 2026 FASHOTF DELIVERY. Todos los derechos reservados.</div></div></footer>

<script src="../js/main.js"></script>
<script src="../js/products.js"></script>
<script>
const IMAGES = {
  1: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=300&q=80',
  2: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=300&q=80',
  3: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80',
  4: 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=300&q=80',
  5: 'https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=300&q=80',
  6: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=300&q=80',
  7: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=300&q=80',
  8: 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=300&q=80'
};

const RESTS = {1:'Burger Palace',2:'Pizza Roma',3:'Fresh Bowl',4:'Tokyo House',5:'Chicken Bros',6:'Sweet Corner',7:'Café Urbano',8:'Smash House'};

function renderCart() {
  const cart = JSON.parse(localStorage.getItem('fashotf_cart') || '[]');
  const container = document.getElementById('cartContent');
  if (!cart.length) {
    container.innerHTML = `<div class="empty-cart"><i class="fa-solid fa-cart-shopping"></i><h2>Tu carrito está vacío</h2><p>Agrega productos desde nuestro menú</p><a href="menu.html" class="btn-primary"><i class="fa-solid fa-utensils"></i> Explorar Menú</a></div>`;
    return;
  }
  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const delivery = subtotal > 30 ? 0 : 3.50;
  const total = subtotal + delivery;
  container.innerHTML = `
    <div class="cart-layout">
      <div>
        <h2 style="font-size:20px;font-weight:800;margin-bottom:20px;">${cart.length} producto(s) en tu carrito</h2>
        <div class="cart-items" id="cartItems">
          ${cart.map((item, idx) => `
            <div class="cart-item" id="item-${idx}">
              <div class="cart-item-img"><img src="${item.image || IMAGES[item.id] || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80'}" alt="${item.name}" /></div>
              <div class="cart-item-info">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-rest"><i class="fa-solid fa-store"></i> ${RESTS[item.id] || 'Restaurante'}</div>
                <div class="qty-ctrl">
                  <button class="qty-btn" onclick="changeQty(${idx},-1)"><i class="fa-solid fa-minus"></i></button>
                  <span class="qty-num">${item.qty}</span>
                  <button class="qty-btn" onclick="changeQty(${idx},1)"><i class="fa-solid fa-plus"></i></button>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
                <div class="cart-item-price">$${(item.price * item.qty).toFixed(2)}</div>
                <button class="del-btn" onclick="removeItem(${idx})"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="order-summary">
        <div class="summary-card">
          <div class="summary-title">Resumen del pedido</div>
          <div class="coupon-row">
            <input type="text" placeholder="Código de descuento" id="couponInput"/>
            <button onclick="applyCoupon()">Aplicar</button>
          </div>
          <div class="summary-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
          <div class="summary-row"><span>Domicilio</span><span>${delivery === 0 ? '<span style="color:var(--teal)">Gratis</span>' : '$' + delivery.toFixed(2)}</span></div>
          <div class="summary-row" id="discountRow" style="display:none;"><span style="color:var(--teal)">Descuento</span><span style="color:var(--teal)" id="discountVal">-$0.00</span></div>
          <div class="summary-total"><span>Total</span><span id="totalDisplay">$${total.toFixed(2)}</span></div>
          <div style="margin-bottom:16px;">
            <div style="font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:10px;">MÉTODO DE PAGO</div>
            <div class="pay-methods">
              <div class="pay-method active" onclick="selectPay(this)"><i class="fa-solid fa-credit-card"></i><span>Tarjeta</span></div>
              <div class="pay-method" onclick="selectPay(this)"><i class="fa-solid fa-money-bill-wave"></i><span>Efectivo</span></div>
              <div class="pay-method" onclick="selectPay(this)"><i class="fa-solid fa-mobile-screen-button"></i><span>Nequi</span></div>
              <div class="pay-method" onclick="selectPay(this)"><i class="fa-solid fa-building-columns"></i><span>Daviplata</span></div>
            </div>
          </div>
          <button class="btn-primary" style="width:100%;justify-content:center;padding:16px;" onclick="checkout()">
            <i class="fa-solid fa-bolt"></i> Confirmar Pedido · $${total.toFixed(2)}
          </button>
          ${delivery > 0 ? `<div style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:12px;"><i class="fa-solid fa-truck"></i> Agrega $${(30-subtotal).toFixed(2)} más para envío gratis</div>` : '<div style="text-align:center;font-size:12px;color:var(--teal);margin-top:12px;"><i class="fa-solid fa-check"></i> ¡Tienes envío gratis!</div>'}
        </div>
      </div>
    </div>`;
}

function changeQty(idx, delta) {
  const cart = JSON.parse(localStorage.getItem('fashotf_cart') || '[]');
  cart[idx].qty = Math.max(1, cart[idx].qty + delta);
  localStorage.setItem('fashotf_cart', JSON.stringify(cart));
  updateCartCount();
  renderCart();
}

function removeItem(idx) {
  const cart = JSON.parse(localStorage.getItem('fashotf_cart') || '[]');
  cart.splice(idx, 1);
  localStorage.setItem('fashotf_cart', JSON.stringify(cart));
  updateCartCount();
  renderCart();
  showToast('Producto eliminado', 'fa-trash');
}

function selectPay(el) {
  document.querySelectorAll('.pay-method').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}

function applyCoupon() {
  const code = document.getElementById('couponInput')?.value.toUpperCase();
  if (code === 'FASHOTF10') {
    document.getElementById('discountRow').style.display = 'flex';
    document.getElementById('discountVal').textContent = '-$2.00';
    showToast('Cupón aplicado: -$2.00', 'fa-tag');
  } else {
    showToast('Cupón inválido', 'fa-circle-xmark');
  }
}

function checkout() {
  const cart = JSON.parse(localStorage.getItem('fashotf_cart') || '[]');
  if (!cart.length) return;
  localStorage.setItem('fashotf_cart', '[]');
  updateCartCount();
  showToast('¡Pedido confirmado! Redirigiendo...', 'fa-circle-check');
  setTimeout(() => { window.location.href = 'rastreo.html'; }, 1800);
}

document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
